# 11/19 sotongmk.com 을 GitHub Pages → Cloudflare Pages(sotong-marketing.pages.dev)로 이사.
# push 때마다(글해줌 새 글·관리 화면 저장 포함) 저장소 파일을 그대로 Cloudflare 에 올린다. 보안 머리글은 루트 _headers(보안머리글.py headers 로 만듦).
# 저장소 Settings › Secrets 에 CLOUDFLARE_API_TOKEN(계정 › Cloudflare Pages: 편집) 을 넣어야 올라간다. 없으면 경고만 남기고 건너뜀.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 올릴 파일만 dist 로 (저장소 설정 파일 제외)
        run: |
          mkdir dist
          git ls-files -z | grep -zv -e '^\.github/' -e '^\.gitignore$' -e '^CNAME$' | xargs -0 cp --parents -t dist
      - name: Cloudflare Pages 에 올리기
        if: env.CF != ''
        # 바깥 액션 대신 wrangler 를 판 고정으로 직접 실행(11/19 wrangler-action 이 npm 확인 단계에서 실패)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c8d100b95847dffe1bc07b1625b4ee5d
        run: npx --yes wrangler@4.165.0 pages deploy dist --project-name=sotong-marketing --branch=main --commit-dirty=true
      - if: env.CF == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN 비밀이 없어 올리지 않았습니다."
